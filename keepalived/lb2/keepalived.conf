global_defs {
    router_id LB2
    enable_script_security
    script_user root
}

vrrp_instance VI_2 {
    state BACKUP
    interface ens18
    virtual_router_id 1
    priority 90
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1111
    }
    virtual_ipaddress {
        172.17.64.149/32 dev ens18 label ens18:vip
    }
}

include /opt/lvs-router/keepalived/virtual_server.conf

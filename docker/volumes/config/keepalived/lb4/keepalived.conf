global_defs {
    router_id LB4
    enable_script_security
    script_user root
}

static_ipaddress {
    172.17.64.159/32 dev lo scope host
}

vrrp_instance VI_4 {
    state BACKUP
    interface ens18
    virtual_router_id 1
    priority 70
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 1111
    }
    virtual_ipaddress {
        172.17.64.159/32 dev ens18 label ens18:vip
    }
    notify_master "/opt/lvs-router/bin/start-ipvs-keepalived.sh"
    notify_backup "/opt/lvs-router/bin/stop-ipvs-keepalived.sh"
    notify_fault "/opt/lvs-router/bin/stop-ipvs-keepalived.sh"
}
